name: Financial AI CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Tests
      run: pytest